<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCM Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init("5nxQpwuN6D-fx4Xv8");
</script><style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fa;
  color:#17202a;
}

header{
  background:#123b2a;
  color:white;
  padding:18px;
}

.top{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h1{
  font-size:22px;
  margin:0;
}

.small{
  font-size:12px;
  color:#68737d;
  margin-top:5px;
}

header .small{
  color:#dce9e1;
}

.container{
  max-width:1200px;
  margin:20px auto;
  padding:10px;
}

.login,
.panel{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.login{
  max-width:430px;
  margin:50px auto;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:14px;
}

.field label{
  font-weight:700;
}

.field input,
.field select{
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  width:100%;
  background:#123b2a;
  color:white;
}

.white{
  background:white;
  color:#123b2a;
}

.error{
  color:#b00020;
  margin:10px 0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:15px;
}

.stat{
  background:white;
  padding:16px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat b{
  font-size:25px;
  display:block;
  margin-top:7px;
  color:#123b2a;
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.filters input{
  flex:1;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
}

.filters select{
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
}

.order{
  border:1px solid #e1e5e8;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.order-id{
  font-weight:700;
  color:#123b2a;
  font-size:17px;
}

.customer{
  margin:12px 0;
  line-height:1.6;
}

.items{
  background:#f7f9f8;
  padding:10px;
  border-radius:8px;
}

.item{
  padding:5px 0;
  border-bottom:1px solid #e5e9e7;
}

.item:last-child{
  border-bottom:0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-top:12px;
}

.status{
  padding:9px;
  border:1px solid #ccc;
  border-radius:8px;
}

.logout{
  background:#fff;
  color:#123b2a;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .filters{
    flex-direction:column;
  }

  .row{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">

    <div>
      <h1>RCM Admin Dashboard</h1>
      <div class="small">
        Orders & Customer Management
      </div>
    </div>

    <button
      id="logoutBtn"
      class="btn logout"
      style="display:none"
      onclick="logout()">
      Logout
    </button>

  </div>
</header>


<main class="container">

<!-- LOGIN -->

<section id="loginBox" class="login">

  <h2>Admin Login</h2>

  <div id="loginError" class="error"></div>

  <form id="loginForm">

    <div class="field">
      <label>Email</label>
      <input
        id="loginEmail"
        type="email"
        required>
    </div>

    <div class="field">
      <label>Password</label>
      <input
        id="loginPassword"
        type="password"
        required>
    </div>

    <button
      class="btn primary"
      type="submit">
      Login
    </button>

  </form>

</section>


<!-- DASHBOARD -->

<section
  id="dashboard"
  style="display:none">

  <div class="stats">

    <div class="stat">
      Total Orders
      <b id="totalOrders">0</b>
    </div>

    <div class="stat">
      New
      <b id="newOrders">0</b>
    </div>

    <div class="stat">
      Confirmed
      <b id="confirmedOrders">0</b>
    </div>

    <div class="stat">
      Delivered
      <b id="deliveredOrders">0</b>
    </div>

  </div>


  <div class="panel">

    <div class="filters">

      <input
        id="orderSearch"
        placeholder="Search Order ID, Name or Mobile">

      <select id="statusFilter">

        <option value="">
          All Status
        </option>

        <option value="New">
          New
        </option>

        <option value="Confirmed">
          Confirmed
        </option>

        <option value="Processing">
          Processing
        </option>

        <option value="Shipped">
          Shipped
        </option>

        <option value="Delivered">
          Delivered
        </option>

        <option value="Cancelled">
          Cancelled
        </option>

      </select>

    </div>


    <div id="ordersList">
      Loading orders...
    </div>

  </div>

</section>

</main>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://ndnsbfhozcaxfmxoetru.supabase.co";


/*
PASTE YOUR EXISTING SUPABASE
PUBLISHABLE KEY BELOW
*/

const SUPABASE_KEY =
"sb_publishable_z0uCg4hAQMMSf7sd4DJAgw_JoPtyMsH"


const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY  
);


let orders = [];


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  document
  .getElementById("loginError")
  .textContent = "";

  const email =
  document
  .getElementById("loginEmail")
  .value
  .trim();

  const password =
  document
  .getElementById("loginPassword")
  .value;


  const {error} =
  await db.auth.signInWithPassword({
    email:email,
    password:password
  });


  if(error){

    document
    .getElementById("loginError")
    .textContent =
    error.message;

    return;
  }


  showDashboard();

});


/* SHOW DASHBOARD */

async function showDashboard(){

  document
  .getElementById("loginBox")
  .style.display="none";

  document
  .getElementById("dashboard")
  .style.display="block";

  document
  .getElementById("logoutBtn")
  .style.display="block";

  await loadOrders();

}


/* LOGOUT */

async function logout(){

  await db.auth.signOut();

  location.reload();

}


/* LOAD ORDERS */

async function loadOrders(){

  document
  .getElementById("ordersList")
  .innerHTML =
  "Loading orders...";


  const {data,error} =
  await db
  .from("orders")
  .select("*")
  .order(
    "created_at",
    {ascending:false}
  );


  if(error){

    console.error(error);

    document
    .getElementById("ordersList")
    .innerHTML =
    '<p class="error">Orders load nahi ho rahe.</p>';

    return;
  }


  orders = data || [];

  renderOrders();

}


/* RENDER */

function renderOrders(){

  const search =
  document
  .getElementById("orderSearch")
  .value
  .toLowerCase()
  .trim();


  const status =
  document
  .getElementById("statusFilter")
  .value;


  const filtered =
  orders.filter(function(order){

    const text =
    [
      order.order_number,
      order.customer_name,
      order.mobile
    ]
    .join(" ")
    .toLowerCase();


    return (
  (!search || text.includes(search))
  &&
  (!status || order.order_status === status)
);

  });


  document
  .getElementById("totalOrders")
  .textContent =
  orders.length;


  document
  .getElementById("newOrders")
  .textContent =
  orders.filter(
    o => o.order_status === "New"
  ).length;


  document
  .getElementById("confirmedOrders")
  .textContent =
  orders.filter(
    o => o.order_status === "Confirmed"
  ).length;


  document
  .getElementById("deliveredOrders")
  .textContent =
  orders.filter(
    o => o.order_status === "Delivered"
  ).length;


  if(!filtered.length){

    document
    .getElementById("ordersList")
    .innerHTML =
    "<p>No orders found.</p>";

    return;
  }


  document
  .getElementById("ordersList")
  .innerHTML =

  filtered.map(function(order){

    const items =
    Array.isArray(order.items)
    ? order.items
    : [];


    return `

    <div class="order">

      <div class="order-head">

        <div>

          <div class="order-id">
            ${esc(order.order_number)}
          </div>

          <div class="small">
            ${new Date(
              order.created_at
            ).toLocaleString("en-IN")}
          </div>

        </div>


        <select
          class="status"
          onchange="updateStatus(
            ${order.id},
            this.value
          )">

          ${[
            "New",
            "Confirmed",
            "Processing",
            "Shipped",
            "Delivered",
            "Cancelled"
          ]
          .map(function(s){

            return `
            <option
              value="${s}"
              ${s === order.order_status
                ? "selected"
                : ""}>
              ${s}
            </option>
            `;

          })
          .join("")}

        </select>

      </div>


      <div class="customer">

        <b>
          ${esc(order.customer_name)}
        </b>

        <br>

        📱 ${esc(order.mobile)}

        ${order.email
          ? `<br>📧 ${esc(order.email)}`
          : ""}

        <br>

        📍 ${esc(order.address)}

        <br>

        ${esc(order.city)},
        ${esc(order.state)}
        -
        ${esc(order.pincode)}

      </div>


      <div class="items">

        <b>Ordered Products</b>

        ${
          items.map(function(item){

            return `

            <div class="item">

              ${esc(item.product_name)}

              (${esc(
                item.quantity_size || ""
              )})

              × ${Number(
                item.quantity || 0
              )}

              — ₹${Number(
                item.mrp || 0
              ).toLocaleString("en-IN")}

            </div>

            `;

          }).join("")
        }

      </div>


      <div class="row">

        <b>
          Total:
          ₹${Number(
            order.total_amount || 0
          ).toLocaleString("en-IN")}
        </b>

        <span class="small">
          Payment:
          ${esc(
            order.payment_method ||
            "Cash on Delivery"
          )}
        </span>

      </div>

    </div>

    `;

  }).join("");

}


/* UPDATE STATUS */

async function updateStatus(
  id,
  status
){

  const {error} =
  await db
  .from("orders")
  .update({
    order_status:status
  })
  .eq("id",id);


  if(error){

    alert(
      "Status update nahi hua: "
      + error.message
    );

    return;
  }


  const order =
  orders.find(
    o => o.id === id
  );


  if(order){

    order.order_status =
    status;

  }
// SEND STATUS UPDATE EMAIL TO CUSTOMER
try {

  if (order && order.email) {

    const itemsText =
      Array.isArray(order.items)
        ? order.items.map(item =>
            `${item.name || item.product_name || "Product"} × ${item.quantity || item.qty || 1} — ₹${item.price || item.mrp || 0}`
          ).join("\n")
        : String(order.items || "");

    const emailResult = await emailjs.send(
      "service_5ss58377",
      "template_5k2lre8",
      {
        email: order.email,
        customer_name: order.customer_name,
        order_id: order.order_number,
        order_status: status,
        payment_method: order.payment_method || "Cash on Delivery",
        orders: itemsText,
        total_amount: order.total_amount
      }
    );

    console.log(
      "Customer status email sent:",
      emailResult
    );

  }

} catch (emailError) {

  console.error(
    "Customer status email error:",
    emailError
  );

}

renderOrders();  
}



/* SEARCH */

document
.getElementById("orderSearch")
.addEventListener(
  "input",
  renderOrders
);


document
.getElementById("statusFilter")
.addEventListener(
  "change",
  renderOrders
);


/* HTML ESCAPE */

function esc(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* EXISTING SESSION */

db.auth
.getSession()
.then(function(result){

  if(result.data.session){

    showDashboard();

  }

});

</script>

</body>
</html>
