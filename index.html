<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCM Products Store</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f7fa;
  color:#17202a;
}
header{
  background:#123b2a;
  color:white;
  padding:18px 15px;
  position:sticky;
  top:0;
  z-index:10;
}
.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.logo{
  font-size:22px;
  font-weight:700;
}
.tag{
  font-size:12px;
  opacity:.8;
}
.search{
  max-width:1200px;
  margin:15px auto 0;
}
.search input{
  width:100%;
  padding:14px 16px;
  border:0;
  border-radius:10px;
  font-size:16px;
  outline:none;
}
.hero{
  max-width:1200px;
  margin:20px auto;
  padding:30px 20px;
  border-radius:18px;
  background:linear-gradient(135deg,#123b2a,#24734b);
  color:white;
}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{opacity:.9}
.categories{
  max-width:1200px;
  margin:20px auto;
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:5px;
}
.categories button{
  white-space:nowrap;
  border:1px solid #ddd;
  background:white;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
}
.categories button.active{
  background:#123b2a;
  color:white;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:10px;
}
.title{
  font-size:22px;
  font-weight:700;
  margin:15px 0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:15px;
}
.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  padding:12px;
}
.product-image{
  height:170px;
  background:#eef2f0;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
  overflow:hidden;
}
.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.no-image{
  color:#7b8794;
  font-size:14px;
}
.brand{
  color:#24734b;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}
.name{
  font-size:15px;
  font-weight:600;
  line-height:1.35;
  min-height:42px;
}
.qty{
  font-size:13px;
  color:#68737d;
  margin:7px 0;
}
.price{
  font-size:20px;
  font-weight:700;
  color:#123b2a;
}
.source{
  display:inline-block;
  margin-top:10px;
  text-decoration:none;
  color:#24734b;
  font-size:12px;
}
.loading,.empty{
  text-align:center;
  padding:40px 10px;
  color:#667;
}
footer{
  margin-top:40px;
  background:#123b2a;
  color:white;
  text-align:center;
  padding:25px;
}
@media(max-width:600px){
  .header{align-items:flex-start}
  .hero h1{font-size:24px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .product-image{height:140px}
  .name{font-size:14px}
  .price{font-size:18px}
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div>
      <div class="logo">RCM Products Store</div>
      <div class="tag">Quality Products • Easy Shopping</div>
    </div>
  </div>

  <div class="search">
    <input id="search" type="search"
      placeholder="Search products...">
  </div>
</header>

<section class="hero">
  <h1>Welcome to Our Product Store</h1>
  <p>Explore products by category and find what you need.</p>
</section>

<div class="categories" id="categories"></div>

<main class="container">
  <div class="title" id="heading">All Products</div>
  <div id="products" class="grid">
    <div class="loading">Loading products...</div>
  </div>
</main>

<footer>
  <p>© 2026 RCM Products Store</p>
  <p style="margin-top:6px;font-size:12px">Product information sourced from official RCM listings.</p>
</footer>

<script>
const SUPABASE_URL = "https://ndnsbfhozcaxfmxoetru.supabase.co";

/* अपनी COPIED PUBLISHABLE KEY नीचे paste करें */
const SUPABASE_KEY = "sb_publishable_z0uCg4hAQMMSf7sd4DJAgw_JoPtyMsH"

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const categories = [
  "All",
  "Health Care",
  "Food & Grocery",
  "Personal Care",
  "Vyomini",
  "Key Soul",
  "Household",
  "Men's Fashion",
  "Women's Fashion",
  "Kid's Fashion",
  "Footwear",
  "Bags & Accessories",
  "Paint & Construction",
  "Agriculture"
];

let allProducts = [];
let selectedCategory = "All";

const categoryBox = document.getElementById("categories");
const productsBox = document.getElementById("products");
const heading = document.getElementById("heading");
const searchBox = document.getElementById("search");

categories.forEach(category => {
  const button = document.createElement("button");
  button.textContent = category;

  if(category === "All") button.classList.add("active");

  button.onclick = () => {
    selectedCategory = category;

    document.querySelectorAll(".categories button")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");
    renderProducts();
  };

  categoryBox.appendChild(button);
});

async function loadProducts(){

  productsBox.innerHTML =
    '<div class="loading">Loading products...</div>';

  const { data, error } = await db
    .from("products")
    .select("*")
    .order("id", { ascending:false });

  if(error){
    console.error(error);
    productsBox.innerHTML =
      '<div class="empty">Products load nahi ho pa rahe hain.</div>';
    return;
  }

  allProducts = data || [];
  renderProducts();
}

function renderProducts(){

  const search = searchBox.value.toLowerCase().trim();

  let products = allProducts.filter(product => {

    const categoryMatch =
      selectedCategory === "All" ||
      product.category === selectedCategory;

    const searchMatch =
      !search ||
      (product.product_name || "").toLowerCase().includes(search) ||
      (product.brand || "").toLowerCase().includes(search) ||
      (product.category || "").toLowerCase().includes(search);

    return categoryMatch && searchMatch;
  });

  heading.textContent =
    selectedCategory === "All"
    ? `All Products (${products.length})`
    : `${selectedCategory} (${products.length})`;

  if(products.length === 0){
    productsBox.innerHTML =
      '<div class="empty">No products found.</div>';
    return;
  }

  productsBox.innerHTML = products.map(product => {

    const image = product.product_image
      ? `<img src="${escapeHtml(product.product_image)}" alt="${escapeHtml(product.product_name)}">`
      : `<div class="no-image">Product Image</div>`;

    const source = product.source_url
      ? `<a class="source" href="${escapeHtml(product.source_url)}" target="_blank">View Product</a>`
      : "";

    return `
      <div class="card">

        <div class="product-image">
          ${image}
        </div>

        <div class="brand">
          ${escapeHtml(product.brand || "")}
        </div>

        <div class="name">
          ${escapeHtml(product.product_name || "")}
        </div>

        <div class="qty">
          ${escapeHtml(product.quantity_size || "Size not specified")}
        </div>

        <div class="price">
          ₹${Number(product.mrp || 0).toLocaleString("en-IN")}
        </div>

        ${source}

      </div>
    `;
  }).join("");
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

searchBox.addEventListener("input", renderProducts);

loadProducts();
</script>

</body>
</html>
